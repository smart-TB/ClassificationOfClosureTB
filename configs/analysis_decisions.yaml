# Decisões da reanálise. Campos 'TBD' bloqueiam as etapas que os exigem.
# Fonte de verdade: briefing.md §5.1.
study:
  protocol_status: "retrospective_protocol"
  protocol_uri: null
  # Maior DT_NOTIFIC observada no snapshot; confirmada em 2026-07-15.
  data_extraction_date: "2026-04-07"
  source_snapshot_id: "sinan-tb-2026-04-07"
  # Decisão clínica do PI (2026-07-19): benchmark fechado nos 3 desfechos de maior
  # impacto para TB sensível — cura, interrupção (códigos 2+10), óbito por TB (código 3).
  primary_target_schema: "sensitive_tb_3class"
  # Tempo zero = notificação/diagnóstico: o abandono primário (nunca iniciou) é
  # população em risco e entra como não-início/interrupção.
  primary_prediction_time: "notification"
  minimum_followup_days: 365
  temporal_validation_enabled: true
  # Último ano completamente observável sob a regra de 365 dias.
  temporal_test_period: "2024"
  cohort_year_min: 2015
  cohort_year_max: 2025

geography:
  # Residência: convenção do DATASUS para indicadores municipais e território
  # cujo contexto atua sobre o paciente. Divergem em 9,89% dos registros.
  municipality_key: "ID_MN_RESI"
  fallback_key: "ID_MUNICIP"

outcomes:
  # Verificado contra o PDF oficial do Ministério da Saúde em 2026-07-15.
  dictionary_version: "SINAN-NET-5.0-tuberculose"

seeds:
  python: 42
  numpy: 42
