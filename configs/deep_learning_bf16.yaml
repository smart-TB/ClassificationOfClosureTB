# Perfil EXPERIMENTAL: validar estabilidade e métricas no desenvolvimento antes
# de substituir FP32. Não escolher precisão por desempenho no holdout.
# Microbenchmark: benefício depende da arquitetura; não aplicar globalmente.
max_epochs: 50
early_stopping_patience: 8
validation_split: 0.15
batch_size: 1024
seed: 42
num_workers: 0
torch_num_threads: 4
precision: bf16-mixed
matmul_precision: highest
inference_batch_size: 4096
prefetch_factor: 2
checkpoint_root: null
