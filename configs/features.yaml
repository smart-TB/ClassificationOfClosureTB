  dictionary_evidence: 'Campo 44: Teste Molecular Rápido TB (TMR-TB / Xpert MTB/RIF), Campo Essencial.
    Códigos 1-5 (detectável sensível a R, detectável resistente a R, não detectável, inconclusivo, não
    realizado): NÃO possui código ''Em andamento'', portanto não sofre a reescrita retroativa do campo
    62 que atinge HIV e Cultura. Introduzido na v5 da ficha; a janela 2015-2025 é toda v5 e a cobertura
    vai de 86,1% (2015) a 95,7% (2025). O Xpert retorna em ~2h: a disponibilidade nas curas é PLANA em
    ~35-38% independente da duração — o valor não se acumula com o tempo. Resíduo declarado: nos óbitos
    sobe de 28,7% (0-7 dias) para 38,4% (8-14) e estabiliza; gap a tempo igual de 7,5 pp, menos da metade
