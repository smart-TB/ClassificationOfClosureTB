# https://portalsinan.saude.gov.br/images/documentos/Agravos/Tuberculose/DICI_DADOS_Tuberculose.pdf
#
# availability:
#   at_notification -- informação existe no momento da primeira notificação
#   post_baseline   -- existe, mas só depois (exame cujo resultado demora)
#   followup        -- preenchido durante o acompanhamento
#   outcome         -- é o desfecho, ou deriva dele
#   internal        -- controle do sistema, não é informação clínica
